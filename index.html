<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAGEN // ARG CIPHER CONSOLE</title>
  <style>
    :root{--bg:#05060a;--panel:#0a0d16;--line:#8ca1ff;--text:#f2f5ff;--muted:#9eb0d8}
    *{box-sizing:border-box} body{margin:0;font-family:Pretendard,"Noto Sans KR",sans-serif;background:radial-gradient(circle at top,#121b43,#05060a 60%);color:var(--text)}
    .app{max-width:980px;margin:24px auto;padding:16px}
    h1{letter-spacing:.08em;margin:0 0 6px}.sub{margin:0 0 14px;color:var(--muted)}
    .panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px}
    textarea,input{width:100%;background:#03050f;color:#fff;border:1px solid #5f6aa7;border-radius:10px;padding:10px}
    textarea{min-height:90px} .row{margin-top:10px} .btns{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
    button{border:none;border-radius:12px;background:#6b7cff;color:#fff;padding:10px 16px;cursor:pointer}
    button.secondary{background:#293057}
    .key-slots{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.slot{width:42px;height:52px;border-radius:12px;background:#f0f0f4;color:#222;display:grid;place-items:center;font-weight:700}
    canvas{width:100%;margin-top:8px;background:#020308;border-radius:12px;border:1px solid #596bcb}
    .hint{font-size:13px;color:#9aa9d0;margin-top:8px}
  </style>
</head>
<body>
  <main class="app">
    <h1>SAGEN // ARG CIPHER CONSOLE</h1>
    <p class="sub">단일 HTML 버전 · 키워드 슬롯 + 암호 비주얼 + ARG 파일 힌트 연동</p>
    <section class="panel">
      <label for="plain">원문 또는 암호문</label>
      <textarea id="plain" placeholder="예) turn crank"></textarea>
      <div class="row">
        <label for="keyword">키워드(영문)</label>
        <input id="keyword" type="text" value="KILP" maxlength="16" />
      </div>
      <div class="btns">
        <button id="encryptBtn">암호화</button>
        <button id="decryptBtn" class="secondary">복호화</button>
        <button id="copyBtn" class="secondary">결과 복사</button>
      </div>
      <label for="result">결과</label>
      <textarea id="result" readonly></textarea>
      <div class="key-slots" id="keySlots"></div>
      <canvas id="rain" width="920" height="320"></canvas>
      <div class="hint">힌트: <code>arg/</code> 폴더 파일들을 조합하면 숨은 키워드 문장이 나옵니다.</div>
    </section>
  </main>
<script>
const plain=document.getElementById('plain'),keyword=document.getElementById('keyword'),result=document.getElementById('result'),slots=document.getElementById('keySlots');
function normalizeKey(){const key=keyword.value.toUpperCase().replace(/[^A-Z]/g,'');keyword.value=key||'KILP';renderSlots(keyword.value);return keyword.value}
function vigenere(text,key,dir=1){let out='',i=0;for(const ch of text){const code=ch.charCodeAt(0);if(code>=65&&code<=90){const s=key.charCodeAt(i%key.length)-65;out+=String.fromCharCode(((code-65+dir*s+26)%26)+65);i++}else if(code>=97&&code<=122){const s=key.charCodeAt(i%key.length)-65;out+=String.fromCharCode(((code-97+dir*s+26)%26)+97);i++}else out+=ch;}return out}
function renderSlots(key){slots.innerHTML='';[...key.slice(0,8)].forEach(c=>{const d=document.createElement('div');d.className='slot';d.textContent=c;slots.appendChild(d)})}
document.getElementById('encryptBtn').onclick=()=>{const key=normalizeKey();result.value=vigenere(plain.value,key,1)};
document.getElementById('decryptBtn').onclick=()=>{const key=normalizeKey();result.value=vigenere(plain.value,key,-1)};
document.getElementById('copyBtn').onclick=async()=>navigator.clipboard.writeText(result.value);
normalizeKey();
const canvas=document.getElementById('rain');const ctx=canvas.getContext('2d');const cols=140;const drops=Array(cols).fill(0);
(function rain(){ctx.fillStyle='rgba(2,3,8,.15)';ctx.fillRect(0,0,canvas.width,canvas.height);for(let i=0;i<cols;i++){const x=i*canvas.width/cols,h=4+Math.random()*16,y=drops[i];ctx.fillStyle=['#3950ff','#6be8ff','#9f8dff','#fff'][Math.floor(Math.random()*4)];ctx.fillRect(x,y,3,h);drops[i]=y>canvas.height?-20:y+h+Math.random()*8}requestAnimationFrame(rain)})();
</script>
</body>
</html>
